<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntelliQR - QR Code Generator & Scanner</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>IntelliQR</h1>
        <div class="theme-toggle-wrapper">
          <button id="theme-toggle" aria-label="Toggle Dark Mode">
            <span class="theme-toggle-track">
              <span class="theme-toggle-icon light-icon">☀️</span>
              <span class="theme-toggle-icon dark-icon">🌙</span>
            </span>
          </button>
        </div>
      </header>

      <div class="tabs">
        <button class="tab-btn active" data-tab="generator">
          QR Generator
        </button>
        <button class="tab-btn" data-tab="scanner">QR Scanner</button>
      </div>

      <div class="tab-content">
        <!-- QR Generator Tab -->
        <div id="generator" class="tab-pane active">
          <div class="input-group">
            <input
              type="text"
              id="qr-text"
              placeholder="Enter text or URL to encode"
            />
            <button id="generate-btn">Generate QR Code</button>
          </div>
          <div class="qr-result">
            <canvas id="qr-canvas"></canvas>
            <button id="download-btn">Download QR Code</button>
          </div>
        </div>

        <!-- QR Scanner Tab -->
        <div id="scanner" class="tab-pane">
          <div class="scanner-options">
            <button id="camera-btn" class="scanner-option-btn active">
              Camera
            </button>
            <button id="file-btn" class="scanner-option-btn">
              File / Paste
            </button>
          </div>

          <!-- Camera Scanner -->
          <div id="camera-scanner" class="scanner-method active">
            <div class="scanner-container">
              <video id="scanner-video" playsinline></video>
              <div class="scanner-overlay">
                <div class="scanner-frame"></div>
              </div>
            </div>
          </div>

          <!-- File Upload & Paste Scanner -->
          <div id="file-scanner" class="scanner-method">
            <div class="file-container" id="drop-area" tabindex="0">
              <input type="file" id="file-input" accept="image/*" hidden />
              <div class="file-content">
                <div class="file-icons">
                  <!-- Upload icon -->
                  <div class="file-icon">
                    <svg
                      width="48"
                      height="48"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                      ></path>
                      <polyline points="17 8 12 3 7 8"></polyline>
                      <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p>Drag & drop</p>
                  </div>

                  <!-- Paste icon -->
                  <div class="file-icon">
                    <svg
                      width="48"
                      height="48"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
                      ></path>
                      <rect
                        x="8"
                        y="2"
                        width="8"
                        height="4"
                        rx="1"
                        ry="1"
                      ></rect>
                    </svg>
                    <p>Paste image</p>
                  </div>
                </div>

                <p class="file-instruction">
                  Drop a QR code image or paste from clipboard (Ctrl+V)
                </p>
                <button id="select-file-btn">Select File</button>

                <canvas id="file-canvas" hidden></canvas>
              </div>
            </div>
          </div>

          <div class="result-container">
            <h3>Scanned Result:</h3>
            <div id="scan-result">No QR code detected</div>
          </div>
        </div>
      </div>

      <footer>
        <p>© 2025 IntelliQR - A Vanilla JavaScript QR Code Tool</p>
      </footer>
    </div>

    <!-- Load QR library -->
    <script src="js/qrcode.js"></script>
    <!-- Load main application script -->
    <script src="js/app.js"></script>
  </body>
</html>
